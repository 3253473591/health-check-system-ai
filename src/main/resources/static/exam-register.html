<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>体检登记 - 体检管理系统</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/report.css">
    <style>
        .nav-logout { color: var(--danger); font-weight: 600; text-decoration: none; }
        .register-form { max-width: 600px; padding: 40px; }
        .form-actions { display: flex; gap: 12px; margin-top: 8px; }
        .required { color: var(--danger); }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <div class="nav-left">
            <div class="nav-brand">体检管理系统</div>
            <div class="nav-links">
                <a href="doctor-home.html">首页</a>
                <a href="exam-register.html" class="active">体检登记</a>
                <a href="exam-list.html">体检记录</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-info"><span>👨‍⚕️ <strong id="currentUser"></strong> | 医生</span></div>
            <a href="#" onclick="logout()" class="nav-logout">退出</a>
        </div>
    </div>

    <div class="page-header">
        <div class="page-title">
            <h2>体检登记</h2>
            <p>为患者登记新的体检记录</p>
        </div>
    </div>

    <div class="table-container register-form">
        <div class="form-group">
            <label>体检者姓名 <span class="required">*</span></label>
            <input type="text" id="realName" class="form-control" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>身份证号 <span class="required">*</span></label>
            <input type="text" id="idNumber" class="form-control" placeholder="请输入身份证号" maxlength="18">
        </div>
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="phone" class="form-control" placeholder="选填" maxlength="11">
        </div>
        <div class="form-group">
            <label>体检套餐 <span class="required">*</span></label>
            <select id="packageId" class="form-control">
                <option value="">-- 请选择套餐 --</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="window.location.href='exam-list.html'">返回列表</button>
            <button type="button" class="btn btn-primary" onclick="doRegister()">提交登记</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    checkAuth('DOCTOR');
    document.getElementById('currentUser').innerText = localStorage.getItem('realName');

    async function loadPackages() {
        const data = await request('/common/packages', 'GET');
        if (!data) return;
        const sel = document.getElementById('packageId');
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.packageId;
            opt.text  = `${p.packageName}（¥${p.price}）`;
            sel.appendChild(opt);
        });
    }

    async function doRegister() {
        const realName  = document.getElementById('realName').value.trim();
        const idNumber  = document.getElementById('idNumber').value.trim();
        const phone     = document.getElementById('phone').value.trim();
        const packageId = document.getElementById('packageId').value;
        if (!realName)  { showToast('请输入体检者姓名', 'warn'); return; }
        if (!idNumber)  { showToast('请输入身份证号',   'warn'); return; }
        if (!packageId) { showToast('请选择体检套餐',   'warn'); return; }

        const res = await request('/doctor/examinations', 'POST', {
            realName, idNumber, phone: phone || null, packageId: parseInt(packageId)
        });
        if (res) {
            showToast(`登记成功！体检单号: ${res.examId}`, 'success');
            setTimeout(() => window.location.href = 'exam-list.html', 1500);
        }
    }

    loadPackages();
</script>
</body>
</html>
