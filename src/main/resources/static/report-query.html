<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>体检报告查询</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .main { max-width: 900px; margin: 48px auto; padding: 0 16px; }
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(3,105,161,0.35);
            transition: transform .2s, box-shadow .2s;
            white-space: nowrap;
        }
        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(3,105,161,0.45);
        }
        .top-bar-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }
        .top-bar-sub {
            font-size: 13px;
            color: #6b7280;
            margin-left: auto;
        }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 32px 36px; margin-bottom: 24px; }

        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }

        .btn-row { margin-top: 20px; display: flex; gap: 12px; }
        .tip { font-size: 12px; color: #9ca3af; margin-top: 12px; }

        .result-title { font-size: 17px; font-weight: 700; color: #111827; margin-bottom: 16px; }
        .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; background:#dcfce7; color:#166534; }
        .empty { text-align:center; padding:32px 0; color:#9ca3af; font-size:14px; }

        .required { color: #ef4444; }

        @media (max-width: 768px) {
            .main { margin: 24px auto; padding: 0 12px; }
            .card { padding: 24px 20px; margin-bottom: 16px; }
            .form-row { flex-direction: column; gap: 16px; }
            .form-group { min-width: 100%; }
            .form-control { font-size: 16px; padding: 12px 14px; height: 48px; }
            .btn-row { flex-direction: column; }
            .btn-row .btn { width: 100%; padding: 14px 24px; font-size: 16px; height: 48px; }
            #resultCard { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            #resultCard table { min-width: 600px; font-size: 14px; }
            #resultCard th, #resultCard td { padding: 12px 8px; white-space: nowrap; }
            .top-bar-sub { display: none; }
        }
    </style>
</head>
<body>
<div class="main">
    <div class="top-bar">
        <a href="login.html" class="back-home-btn">← 返回首页</a>
        <div class="top-bar-title">🏥 体检报告查询</div>
        <div class="top-bar-sub">仅可查询已发布的体检报告</div>
    </div>

    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label>姓名 <span class="required">*</span></label>
                <input type="text" id="realName" class="form-control" placeholder="请输入真实姓名" maxlength="50">
            </div>
            <div class="form-group">
                <label>身份证号 <span class="required">*</span></label>
                <input type="text" id="idNumber" class="form-control" placeholder="请输入18位身份证号" maxlength="18">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">查询报告</button>
        </div>
        <p class="tip">* 请输入完整的姓名和身份证号，仅可查询已发布的体检报告。</p>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <div class="result-title">查询结果</div>
        <div id="resultBody"></div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const API = '/api/public/report';

    async function doQuery() {
        const realName = document.getElementById('realName').value.trim();
        const idNumber = document.getElementById('idNumber').value.trim();
        if (!realName) { showToast('请输入姓名', 'warn'); return; }
        if (!idNumber) { showToast('请输入身份证号', 'warn'); return; }

        const btn = document.getElementById('queryBtn');
        btn.disabled = true;
        btn.textContent = '查询中...';

        try {
            const resp = await fetch(API + '/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ realName, idNumber })
            });
            const json = await resp.json();
            if (json.code !== 200) { showToast('查询失败：' + json.msg, 'error'); return; }
            renderResult(json.data);
        } catch (e) {
            showToast('网络错误，请稍后重试', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '查询报告';
        }
    }

    function renderResult(list) {
        const card = document.getElementById('resultCard');
        const body = document.getElementById('resultBody');
        card.style.display = 'block';

        if (!list || !list.length) {
            body.innerHTML = '<div class="empty">未查询到已发布的体检报告，请确认姓名和身份证号是否正确。</div>';
            return;
        }

        body.innerHTML = `
            <table>
                <thead><tr>
                    <th>姓名</th><th>体检套餐</th><th>发布日期</th><th>状态</th>
                    <th style="text-align:center;">操作</th>
                </tr></thead>
                <tbody>
                    ${list.map(r => `<tr>
                        <td><strong>${r.realName}</strong></td>
                        <td>${r.packageName||'-'}</td>
                        <td>${r.publishTime||'-'}</td>
                        <td><span class="badge">已发布</span></td>
                        <td style="text-align:center;">
                            <button class="btn btn-primary btn-sm"
                                onclick="window.location.href='report-view.html?reportId=${r.reportId}'">
                                查看报告
                            </button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doQuery(); });
</script>
</body>
</html>
