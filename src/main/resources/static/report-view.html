<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>体检报告</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        @media (max-width: 768px) {
            .table-wrap {
                margin: 0 -16px;
                padding: 0 16px;
                width: calc(100% + 32px);
            }
            .table-wrap table { min-width: 600px; }
        }
    </style>
</head>
<body>

<div class="action-bar" id="actionBar">
    <span class="brand">🏥 体检管理系统</span>
    <button class="btn btn-secondary" onclick="window.location.href='report-query.html'">← 返回查询</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 打印报告</button>
</div>

<div class="report-wrap">
    <div class="report-card" id="reportCard">
        <div class="loading" id="loadingTip">加载中，请稍候...</div>
        <div id="reportContent" style="display:none;"></div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const API = '/api/public/report';
    const params = new URLSearchParams(window.location.search);
    const reportId = params.get('reportId');

    if (!reportId) {
        document.getElementById('loadingTip').textContent = '缺少报告 ID，请从查询页进入。';
    } else {
        loadReport(reportId);
    }

    async function loadReport(id) {
        try {
            const resp = await fetch(`${API}/${id}`);
            const json = await resp.json();
            if (json.code !== 200) { document.getElementById('loadingTip').textContent = '加载失败：' + json.msg; return; }
            render(json.data);
        } catch (e) {
            document.getElementById('loadingTip').textContent = '网络错误，请稍后重试。';
        }
    }

    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render(d) {
        const tags = (d.packageItemNames||[]).map(n=>`<span class="tag">${esc(n)}</span>`).join('');
        const dataRows = (d.dataTable||[]).map(row => {
            let cls='', abn=esc(row.abnormal)||'—';
            if (abn==='高') cls='abn-high'; else if (abn==='低') cls='abn-low'; else if (abn==='无异常') cls='abn-ok';
            return `<tr>
                <td style="font-weight:600;">${esc(row.itemName)}</td>
                <td>${esc(row.itemValue)}</td>
                <td>${esc(row.unit)||'-'}</td>
                <td style="color:#6b7280;">${esc(row.refRange)||'-'}</td>
                <td><span class="${cls}">${abn}</span></td>
            </tr>`;
        }).join('') || '<tr><td colspan="5" style="text-align:center;color:#9ca3af;">暂无数据</td></tr>';

        document.getElementById('loadingTip').style.display   = 'none';
        document.getElementById('reportContent').style.display = 'block';
        document.getElementById('reportContent').innerHTML = `
            <div class="report-view-title">体 检 报 告</div>
            <div class="report-view-subtitle">Health Examination Report</div>
            <hr class="thick">

            <div class="report-info-grid">
                <div class="report-info-cell"><span class="label">姓名：</span><span class="val">${esc(d.realName)}</span></div>
                <div class="report-info-cell"><span class="label">性别：</span><span class="val">${esc(d.gender)||'-'}</span></div>
                <div class="report-info-cell"><span class="label">年龄：</span><span class="val">${d.age?esc(d.age)+' 岁':'-'}</span></div>
                <div class="report-info-cell"><span class="label">身份证：</span><span class="val">${esc(d.idNumber)}</span></div>
                <div class="report-info-cell"><span class="label">手机号：</span><span class="val">${esc(d.phone)||'-'}</span></div>
                <div class="report-info-cell"><span class="label">体检套餐：</span><span class="val">${esc(d.packageName)||'-'}</span></div>
            </div>

            <div style="font-size:13px;color:#6b7280;margin-top:6px;">
                套餐项目：
                <div class="report-tag-row">${tags||'<span style="color:#9ca3af;">暂无</span>'}</div>
            </div>
            <hr class="thin">

            <div class="report-section-title">体检数据</div>
            <div class="table-wrap">
                <table class="report-table">
                    <thead><tr><th>项目名称</th><th>检查结果</th><th>单位</th><th>参考范围</th><th>异常情况</th></tr></thead>
                    <tbody>${dataRows}</tbody>
                </table>
            </div>

            <div class="report-section-title">体检结论</div>
            <div class="report-text-block">${esc(d.conclusion)||'（暂无结论）'}</div>

            <div class="report-section-title">健康建议</div>
            <div class="report-text-block">${esc(d.advice)||'（暂无建议）'}</div>

            <div class="report-sign-row">
                <div class="report-sign-item">发布日期：<strong>${esc(d.publishTime)||'-'}</strong></div>
                <div class="report-sign-item" style="text-align:right;">
                    医生签名：<strong>${esc(d.doctorSign)||'-'}</strong>
                    <div style="margin-top:4px;font-size:12px;color:#9ca3af;">（电子签名）</div>
                </div>
            </div>`;
    }
</script>
</body>
</html>
