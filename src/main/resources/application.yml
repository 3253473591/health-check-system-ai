server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:health_check_system}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.health: debug

# ---------------------------------------------------------------
# RAG：本地 AnythingLLM（含向量库 LanceDB）
# 首次运行请设置 RAG_API_KEY 环境变量（见 .env.example），
# 或在同目录新建 application-local.yml 覆盖本节。
# ---------------------------------------------------------------
rag:
  enabled: ${RAG_ENABLED:true}
  url: ${RAG_URL:http://localhost:3001}
  api-key: ${RAG_API_KEY:}
  workspace: ${RAG_WORKSPACE:health-check}
  connect-timeout: 10000
  read-timeout: 30000
  stream-idle-timeout: 30000

ai:
  cache:
    ttl-hours: 24

# ---------------------------------------------------------------
# 敏感字段透明加密（身份证号 / 手机号，AES-256-CBC）
# 生产环境必须替换为自己的密钥，且 key/iv 不得相同。
# 生成方式：openssl rand -base64 16
# ---------------------------------------------------------------
crypto:
  aes:
    key: ${CRYPTO_AES_KEY:MTIzNDU2Nzg5MDEyMzQ1Ng==}
    iv: ${CRYPTO_AES_IV:MTIzNDU2Nzg5MDEyMzQ1Ng==}
